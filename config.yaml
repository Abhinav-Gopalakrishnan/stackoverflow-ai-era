api:
  base_url: "https://api.stackexchange.com/2.3"
  site: "stackoverflow"
  page_size: 100
  min_delay_s: 0.5
  max_retries: 5
  quota_floor: 50
  # Filter includes: question body, question_id, accepted_answer_id, owner (user_id),
  # answer_count, creation_date, tags, title, score, view_count plus default wrapper fields
  # (items, has_more, backoff, quota_max, quota_remaining).
  # Generated by create_filter() on 2026-10-02.
  filter: "!SyjNqbwGU2NWZ1zo9n"

paths:
  raw_dir: "data/raw/collect"
  log: "logs/collection_log.csv"
